[package]
name = "brined-almanac"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "brined-almanac"
path = "src/main.rs"

[dependencies]
almanac = { git = "https://github.com/ivy/almanac", rev = "32c2866" }
github = { git = "https://github.com/ivy/almanac", rev = "32c2866" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"
