[package]
name = "brined-almanac"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "brined-almanac"
path = "src/main.rs"

[dependencies]
almanac = { git = "https://github.com/ivy/almanac", rev = "b8bdefa" }
github = { git = "https://github.com/ivy/almanac", rev = "b8bdefa" }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
taskchampion = { version = "3.1.0", default-features = false, features = ["storage-sqlite", "server-sync", "server-local", "bundled", "tls-webpki-roots"] }
tokio = { version = "1", features = ["rt", "sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"
