[package]
name = "brined-almanac"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "brined-almanac"
path = "src/main.rs"

[dependencies]
almanac = { git = "https://github.com/ivy/almanac", rev = "b8bdefa" }
github = { git = "https://github.com/ivy/almanac", rev = "b8bdefa" }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
time = { version = "0.3", features = ["parsing", "formatting", "macros"] }
taskchampion = { version = "3.1.0", default-features = false, features = ["storage-sqlite", "server-sync", "server-local", "bundled", "tls-webpki-roots"] }
tokio = { version = "1", features = ["rt", "sync"] }
toml = "0.8"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }
tempfile = "3"
