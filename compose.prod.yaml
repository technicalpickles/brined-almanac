# The prod stack on this Mac. Deploy with `mise run deploy`, which resolves the
# four secrets through `op run`. State lives in BRINED_ALMANAC_STATE.
name: brined-almanac-prod
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: almanac
      POSTGRES_DB: almanac
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "almanac"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  almanac:
    image: brined-almanac:prod
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: ${BRINED_ALMANAC_STATE:-${HOME}/.local/share/brined-almanac}/prod.env
    environment:
      DATABASE_URL: postgres://almanac@db:5432/almanac
      BRENT_TRANSCRIPTS: /transcripts
      LOCAL_TIERS: /etc/brined-almanac/tiers.toml
      # Never read; its value changes with the file so compose recreates the container on an edit.
      LOCAL_TIERS_SHA256: "${BRINED_ALMANAC_TIERS_SHA256:?run `mise run deploy`, which fetches tiers.toml}"
      ALMANAC_LISTEN: 0.0.0.0:8788
      GITHUB_TOKEN: "${BRINED_ALMANAC_GITHUB_TOKEN:?run `mise run deploy`, which resolves it through op run}"
      TASKCHAMPION_CLIENT_ID: "${BRINED_ALMANAC_TASKCHAMPION_CLIENT_ID:?run `mise run deploy`, which resolves it through op run}"
      TASKCHAMPION_ENCRYPTION_SECRET: "${BRINED_ALMANAC_TASKCHAMPION_ENCRYPTION_SECRET:?run `mise run deploy`, which resolves it through op run}"
    ports:
      - "127.0.0.1:8788:8788"
    volumes:
      - "${BRINED_ALMANAC_STATE:-${HOME}/.local/share/brined-almanac}/transcripts:/transcripts:ro"
      - "${BRINED_ALMANAC_STATE:-${HOME}/.local/share/brined-almanac}/tiers.toml:/etc/brined-almanac/tiers.toml:ro"
      - taskchampion:/var/lib/brined-almanac/taskchampion
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8788/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  puller:
    image: brined-almanac-puller:prod
    init: true
    restart: unless-stopped
    env_file: ${BRINED_ALMANAC_STATE:-${HOME}/.local/share/brined-almanac}/prod.env
    environment:
      PULLER_KEY: "${BRINED_ALMANAC_PULLER_KEY:?run `mise run deploy`, which resolves it through op run}"
    tmpfs:
      # Owner and mode are explicit: the default mount is 1777 on create but root 755 after a
      # restart, which locks the puller out of its key file.
      - /run/puller:mode=0700,uid=10002,gid=10002
    volumes:
      - "${BRINED_ALMANAC_STATE:-${HOME}/.local/share/brined-almanac}/transcripts:/transcripts"
      - "${BRINED_ALMANAC_STATE:-${HOME}/.local/share/brined-almanac}/known_hosts:/etc/ssh/ssh_known_hosts:ro"
    healthcheck:
      test:
        - CMD-SHELL
        - test $$(( $$(date +%s) - $$(cat /transcripts/.last-pull 2>/dev/null || echo 0) )) -lt $$(( $${PULL_INTERVAL_MINUTES:-10} * 180 ))
      interval: 60s
      timeout: 5s
      retries: 3
      # The first deploy pulls every session from zero (about 5 minutes for 51 MB in 2026-11),
      # and .last-pull appears only after a whole pass.
      start_period: 20m
      start_interval: 10s

  backup:
    # One dump of the store a day, kept for 14 days. Losing pgdata refiles every issue.
    # The dump lands under a temporary name, so a restore never sees a half-written file.
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: almanac
      PGDATABASE: almanac
    volumes:
      - "${BRINED_ALMANAC_STATE:-${HOME}/.local/share/brined-almanac}/backups:/backups"
    command:
      - sh
      - -ec
      - |
        while :; do
          name=almanac-$$(date +%F).sql
          pg_dump > "/backups/.$$name.tmp"
          mv "/backups/.$$name.tmp" "/backups/$$name"
          find /backups -name 'almanac-*.sql' -mtime +14 -delete
          echo "backup: wrote $$name"
          sleep 86400
        done
    healthcheck:
      # Unhealthy when no dump is younger than 25 hours.
      test: ["CMD-SHELL", "test -n \"$$(find /backups -name 'almanac-*.sql' -mmin -1500)\""]
      interval: 5m
      timeout: 5s
      retries: 3
      start_period: 2m

volumes:
  pgdata:
  taskchampion:
