[tools]
hk = "2.7.1"
gitleaks = "8.30.1"
rust = "1.99.0"
shellcheck = "0.10.0"

# DB_PORT and PORTOOL_WORKTREE_ID come from portool (.portool.toml). DATABASE_URL is set only
# by the `live` task, on purpose: a dry run against the store admits every delivery id, so a
# dry run followed by a live run files nothing. Dry runs stay on the in-memory store.
[env]
_.file = ".env.portool"
COMPOSE_PROJECT_NAME = "brined-almanac-{{ env.PORTOOL_WORKTREE_ID | default(value='unsynced') | truncate(length=8, end='') }}"

[tasks.check]
description = "Run every guardrail by hand (fmt, clippy, gitleaks, and the forbidden-strings check)"
run = "hk check"

[tasks.test]
description = "Run the unit and integration tests"
run = "cargo test && puller/pull.test.sh"

[tasks."image:smoke"]
description = "Build the almanac image and check it: mise run image:smoke [-- TAG]"
run = "scripts/image-smoke"

[tasks.deploy]
description = "Build both images and start or update the prod stack; --db-only for the first deploy"
run = "scripts/deploy"

[tasks.prod]
description = "Run a verb in the prod stack: mise run prod -- check | backfill"
run = "env -u COMPOSE_PROJECT_NAME BRINED_ALMANAC_GITHUB_TOKEN=unused BRINED_ALMANAC_PULLER_KEY=unused docker compose -f compose.prod.yaml exec almanac brined-almanac"

[tasks.db]
description = "Start this checkout's Postgres on the port portool allocated (data persists in a named volume)"
run = """
set -euo pipefail
portool sync --quiet
port=$(sed -n 's/^DB_PORT=//p' .env.portool)
[ -n "$port" ] || { echo "mise run db: .env.portool has no DB_PORT; run \\`portool sync\\` here from a normal terminal (the agent sandbox may block ~/.local/state/portool)" >&2; exit 1; }
DB_PORT=$port docker compose up -d --wait db
echo "postgres: 127.0.0.1:$port (compose project $COMPOSE_PROJECT_NAME, volume ${COMPOSE_PROJECT_NAME}_pgdata)"
"""

[tasks."db:down"]
description = "Worktrees only: remove this checkout's Postgres and volume and release its ports"
run = """
set -euo pipefail
[ -f .git ] || { echo "mise run db:down: refusing in the main checkout; its store is the interim store for live runs. Use docker compose down (no -v) to stop it." >&2; exit 1; }
[ -f .env.portool ] || { echo "db:down: no .env.portool, nothing to tear down"; exit 0; }
port=$(sed -n 's/^DB_PORT=//p' .env.portool)
DB_PORT=${port:-0} docker compose down -v
portool release
"""

[tasks.live]
description = "Run a verb live against this checkout's store and GitHub: mise run live -- check | backfill"
run = """
set -euo pipefail
port=$(sed -n 's/^DB_PORT=//p' .env.portool 2>/dev/null || true)
[ -n "$port" ] || { echo "mise run live: no DB_PORT; run \\`mise run db\\` first" >&2; exit 1; }
ALMANAC_MODE=live DATABASE_URL="postgres://almanac@127.0.0.1:$port/almanac" GITHUB_TOKEN="$(gh auth token)" cargo run -q --
"""
