[tools]
go = "1.26.4"
hk = "2.7.1"
gitleaks = "8.30.1"
rust = { version = "1.99.0", components = "clippy,rustfmt" }
shellcheck = "0.10.0"

# DB_PORT and PORTOOL_WORKTREE_ID come from portool (.portool.toml). DATABASE_URL is set only
# by the `live` task, so dry runs need no database.
[env]
_.file = ".env.portool"
# op checks the 1Password app's group container for policies on every command, even with a
# service account token. macOS answers with an "access data from other apps" prompt charged to
# whatever launched op, and under an agent sandbox op hangs on it. This undocumented switch skips
# the check (1Password community post 25335; measured 2026-11-11: op whoami exits in ~1s with it,
# hangs without).
OP_LOAD_DESKTOP_APP_SETTINGS = "false"
COMPOSE_PROJECT_NAME = "brined-almanac-{{ env.PORTOOL_WORKTREE_ID | default(value='unsynced') | truncate(length=8, end='') }}"

[tasks.check]
description = "Run every guardrail by hand (fmt, clippy, gitleaks, and the forbidden-strings check)"
run = "hk check"

[tasks.test]
description = "Run the unit and integration tests"
depends = ["test:portable", "test:macos"]

[tasks."test:portable"]
description = "Run the tests that need nothing macOS-specific (CI runs these on Linux)"
run = "cargo test && puller/pull.test.sh && puller/fetch-report.test.sh && checks/puller-age.test.sh && checks/stack-health.test.sh && checks/collect.test.sh && scripts/fence-line.test.sh && scripts/fence-test.test.sh && scripts/check-forbidden.test.sh"

[tasks."test:macos"]
description = "Run the launchd installer test, which needs plutil"
run = "scripts/install-host-state.test.sh"

[tasks."image:smoke"]
description = "Build the almanac image and check it: mise run image:smoke [-- TAG]"
run = "scripts/image-smoke"

[tasks.deploy]
description = "Build both images and start or update the prod stack; --db-only for the first deploy"
run = "scripts/deploy"

[tasks.cutover]
description = "Resolve in prod Bugsink what GitHub already closed: mise run cutover [-- --apply]"
run = "scripts/cutover"

[tasks.prod]
description = "Run a verb in the prod stack: mise run prod -- check | backfill"
run = "env -u COMPOSE_PROJECT_NAME BRINED_ALMANAC_GITHUB_TOKEN=unused BRINED_ALMANAC_GITHUB_ALERTS_TOKEN=unused BRINED_ALMANAC_PULLER_KEY=unused BRINED_ALMANAC_TASKCHAMPION_CLIENT_ID=unused BRINED_ALMANAC_TASKCHAMPION_ENCRYPTION_SECRET=unused BRINED_ALMANAC_BUGSINK_DSN=unused BRINED_ALMANAC_BUGSINK_API_TOKEN=unused BRINED_ALMANAC_TIERS_SHA256=unused docker compose -f compose.prod.yaml exec almanac brined-almanac"

[tasks.db]
description = "Start this checkout's Postgres on the port portool allocated (data persists in a named volume)"
run = """
set -euo pipefail
portool sync --quiet
port=$(sed -n 's/^DB_PORT=//p' .env.portool)
[ -n "$port" ] || { echo "mise run db: .env.portool has no DB_PORT; run \\`portool sync\\` here from a normal terminal (the agent sandbox may block ~/.local/state/portool)" >&2; exit 1; }
DB_PORT=$port docker compose up -d --wait db
echo "postgres: 127.0.0.1:$port (compose project $COMPOSE_PROJECT_NAME, volume ${COMPOSE_PROJECT_NAME}_pgdata)"
"""

[tasks."db:down"]
description = "Remove this checkout's Postgres servers (Rust and Go) and volumes and release its ports"
run = """
set -euo pipefail
[ -f .env.portool ] || { echo "db:down: no .env.portool, nothing to tear down"; exit 0; }
port=$(sed -n 's/^DB_PORT=//p' .env.portool)
failed=0
DB_PORT=${port:-0} docker compose down -v || { echo "db:down: removing the Rust store failed (see above)" >&2; failed=1; }
# Releasing the block frees GO_DB_PORT too, so the Go store should not outlive it. A failed
# teardown must not leave the block held either, so the release below runs regardless.
GO_DB_PORT=0 docker compose -f compose.go.yaml -p "$COMPOSE_PROJECT_NAME-go" down -v || { echo "db:down: removing the Go store failed (see above); releasing the ports anyway, so remove compose project $COMPOSE_PROJECT_NAME-go by hand" >&2; failed=1; }
portool release || { echo "db:down: portool release failed (see above)" >&2; failed=1; }
exit $failed
"""

[tasks."db:pending"]
description = "Fail if this checkout's store holds events not yet run; check before deploying a change to an event's payload"
run = """
set -euo pipefail
count=$(docker compose exec -T db psql -U almanac -d almanac -tAc 'select count(*) from pending')
[ "$count" = 0 ] || { echo "db:pending: $count event(s) wait in pending. A binary with a different payload shape fails them and never retries (ivy/almanac#10). Let them run on the current binary first." >&2; exit 1; }
echo "db:pending: nothing pending"
"""

[tasks.live]
description = "Run a verb live against this checkout's store and GitHub: mise run live -- check | backfill"
run = """
set -euo pipefail
port=$(sed -n 's/^DB_PORT=//p' .env.portool 2>/dev/null || true)
[ -n "$port" ] || { echo "mise run live: no DB_PORT; run \\`mise run db\\` first" >&2; exit 1; }
ALMANAC_MODE=live DATABASE_URL="postgres://almanac@127.0.0.1:$port/almanac" GITHUB_TOKEN="$(gh auth token)" cargo run -q --
"""

# The Go port's own store and port (docs/adrs/0002-own-ports-and-database-for-the-go-port.md).
[tasks."go:db"]
description = "Start this checkout's Go port Postgres on the port portool allocated as GO_DB_PORT"
run = """
set -euo pipefail
portool sync --quiet
port=$(sed -n 's/^GO_DB_PORT=//p' .env.portool)
[ -n "$port" ] || { echo "mise run go:db: .env.portool has no GO_DB_PORT; run \\`portool sync\\` here from a normal terminal (the agent sandbox may block ~/.local/state/portool)" >&2; exit 1; }
GO_DB_PORT=$port docker compose -f compose.go.yaml -p "$COMPOSE_PROJECT_NAME-go" up -d --wait db
echo "postgres (Go port): 127.0.0.1:$port/brined_almanac_go (compose project $COMPOSE_PROJECT_NAME-go)"
"""

[tasks."go:db:down"]
description = "Remove this checkout's Go port Postgres and its volume, keeping the portool block"
run = """
set -euo pipefail
GO_DB_PORT=0 docker compose -f compose.go.yaml -p "$COMPOSE_PROJECT_NAME-go" down -v
"""

[tasks."go:run"]
description = "Run a Go port verb against its own store and port: mise run go:run -- run | check | backfill"
run = """
set -euo pipefail
port=$(sed -n 's/^GO_DB_PORT=//p' .env.portool 2>/dev/null || true)
[ -n "$port" ] || { echo "mise run go:run: no GO_DB_PORT; run \\`mise run go:db\\` first" >&2; exit 1; }
ALMANAC_CONFIG=almanac.go.toml DATABASE_URL="postgres://brined_almanac_go@127.0.0.1:$port/brined_almanac_go" go run ./cmd/brined-almanac
"""
